abstract: The MIMED dataset provides EEG recordings of motor imagery and motor execution for six activities (raising and lowering
  each hand, standing and sitting) from 30 subjects, acquired with a 14-channel Emotiv EPOC X headset at 128 Hz. The distributed
  imagery .mat files carry no per-repetition activity label, so the loader exposes the reliable folder-level 3-class task
  (left_hand / right_hand / trunk).
